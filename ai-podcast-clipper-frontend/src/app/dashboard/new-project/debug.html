<!DOCTYPE html>
<html>
<head>
    <title>Debug YouTube Metadata</title>
</head>
<body>
    <h1>Debug YouTube Metadata Fetching</h1>
    
    <button id="testBtn">Test API Call</button>
    <div id="result"></div>
    
    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Loading...';
            
            try {
                console.log('Starting API call...');
                const response = await fetch('/api/youtube-metadata?url=https://www.youtube.com/watch?v=dU7GwCOgvNY');
                console.log('Response received:', response);
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Data:', data);
                
                resultDiv.innerHTML = `
                    <h3>Success!</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <h3>Error!</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
